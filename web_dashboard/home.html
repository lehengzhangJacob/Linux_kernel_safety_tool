<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内核并发安全分析系统 - 控制台</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .scan-line {
            width: 100%;
            height: 2px;
            background: #3b82f6;
            position: absolute;
            top: 0;
            left: 0;
            animation: scan 2s linear infinite;
            box-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6;
            display: none;
        }
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scanning .scan-line {
            display: block;
        }
        .log-container::-webkit-scrollbar {
            width: 4px;
        }
        .log-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 2px;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center overflow-hidden">
    <div id="app" class="w-full max-w-3xl p-6">
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg shadow-blue-500/30">
                <span class="text-3xl font-bold text-white">K</span>
            </div>
            <h1 class="text-4xl font-bold tracking-tight mb-2">内核并发安全分析系统</h1>
            <p class="text-slate-400">Kernel Concurrency Safety Analyzer - SaaS Platform</p>
        </div>

        <!-- Main Panel -->
        <div class="glass-panel rounded-2xl p-8 relative overflow-hidden" :class="{ 'scanning': isScanning }">
            <div class="scan-line"></div>
            
            <div v-if="!isScanning && !scanComplete" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">选择分析目标 (内核源码目录)</label>
                    <select v-model="selectedTarget" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        <option value="linux-6.12.6">linux-6.12.6 (推荐)</option>
                        <option value="linux-6.6.1">linux-6.6.1</option>
                        <option value="test_case">自定义上传路径...</option>
                    </select>
                </div>

                <div v-if="selectedTarget === 'test_case'">
                    <input type="text" placeholder="请输入服务器上的绝对路径，例如: /home/user/my_kernel" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>

                <div class="pt-4">
                    <button @click="startScan" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-lg shadow-lg shadow-blue-600/20 transition-all transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        开始安全审计
                    </button>
                </div>
            </div>

            <!-- Scanning Progress -->
            <div v-else class="space-y-6">
                <div class="flex justify-between items-end mb-2">
                    <h3 class="text-lg font-semibold text-blue-400 flex items-center gap-2">
                        <svg v-if="!scanComplete" class="animate-spin h-5 w-5 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <svg v-else class="h-5 w-5 text-emerald-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        {{ scanComplete ? '审计完成' : '正在执行深度并发安全分析...' }}
                    </h3>
                    <span class="text-2xl font-bold font-mono" :class="scanComplete ? 'text-emerald-400' : 'text-blue-400'">{{ progress }}%</span>
                </div>
                
                <div class="w-full bg-slate-900 rounded-full h-4 border border-slate-700 overflow-hidden">
                    <div class="h-4 rounded-full transition-all duration-500 ease-out relative" 
                         :class="scanComplete ? 'bg-emerald-500' : 'bg-blue-600'"
                         :style="`width: ${progress}%`">
                        <div class="absolute top-0 left-0 right-0 bottom-0 bg-white/20" style="animation: shimmer 2s infinite linear; background-image: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transform: skewX(-20deg);"></div>
                    </div>
                </div>

                <div class="bg-slate-900 border border-slate-700 rounded-lg p-4 h-48 overflow-y-auto log-container font-mono text-xs text-slate-400 space-y-1" id="logBox">
                    <div v-for="(log, index) in logs" :key="index" class="animate-fade-in">
                        <span class="text-slate-500">[{{ new Date().toLocaleTimeString() }}]</span> 
                        <span :class="{'text-emerald-400': log.includes('完成') || log.includes('成功'), 'text-amber-400': log.includes('警告')}">{{ log }}</span>
                    </div>
                    <div v-if="!scanComplete" class="text-blue-500 animate-pulse">_</div>
                </div>

                <div v-if="scanComplete" class="pt-2 animate-fade-in">
                    <button @click="goToDashboard" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-2">
                        查看可视化分析报告
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-8 text-slate-500 text-sm">
            <p>基于 GCC 插件的静态分析引擎 & Neo4j 图数据库</p>
        </div>
    </div>

    <script>
        const { createApp, ref, nextTick } = Vue;

        createApp({
            setup() {
                const selectedTarget = ref('linux-6.12.6');
                const isScanning = ref(false);
                const scanComplete = ref(false);
                const progress = ref(0);
                const logs = ref([]);
                let pollInterval = null;

                const scrollToBottom = () => {
                    nextTick(() => {
                        const box = document.getElementById('logBox');
                        if (box) box.scrollTop = box.scrollHeight;
                    });
                };

                const startScan = async () => {
                    isScanning.value = true;
                    scanComplete.value = false;
                    progress.value = 0;
                    logs.value = ['初始化分析引擎...', `目标: ${selectedTarget.value}`];
                    
                    try {
                        // Call backend API to start scan
                        await fetch('http://localhost:5000/api/scan', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ target: selectedTarget.value })
                        });

                        // Poll for status
                        pollInterval = setInterval(async () => {
                            const res = await fetch('http://localhost:5000/api/scan/status');
                            const data = await res.json();
                            
                            progress.value = data.progress;
                            
                            // Only add new logs
                            if (data.logs && data.logs.length > logs.value.length - 2) {
                                const newLogs = data.logs.slice(logs.value.length - 2);
                                logs.value.push(...newLogs);
                                scrollToBottom();
                            }

                            if (data.status === 'completed') {
                                clearInterval(pollInterval);
                                scanComplete.value = true;
                                progress.value = 100;
                                // Auto redirect after 2 seconds
                                setTimeout(() => {
                                    goToDashboard();
                                }, 2000);
                            }
                        }, 500);

                    } catch (error) {
                        logs.value.push(`错误: 无法连接到分析服务器 (${error.message})`);
                        isScanning.value = false;
                    }
                };

                const goToDashboard = () => {
                    window.location.href = 'index.html';
                };

                return {
                    selectedTarget,
                    isScanning,
                    scanComplete,
                    progress,
                    logs,
                    startScan,
                    goToDashboard
                };
            }
        }).mount('#app');
    </script>
    <style>
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) skewX(-20deg); }
            100% { transform: translateX(200%) skewX(-20deg); }
        }
    </style>
</body>
</html>
